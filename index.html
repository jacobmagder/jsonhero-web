<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pure JSON Viewer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="toolbar">
        <button id="theme-toggle-button">Toggle Theme</button>
        <button id="process-json-button">View JSON</button>
        <button id="save-json-button">Save JSON</button> <!-- Added for optional step 5 -->
    </div>

    <div class="container">
        <div class="input-area">
            <textarea id="json-input" placeholder="Paste your JSON here..."></textarea>
        </div>

        <div class="output-area">
            <div id="selected-path-display-container">
                Path: <span id="selected-path-display"></span>
                <button id="copy-path-button" title="Copy Path">Copy</button>
            </div>
            <div id="json-tree-display">
                <!-- JSON tree will be rendered here -->
            </div>
        </div>
    </div>

    <script src="script.js" defer></script>
</body>
</html>
