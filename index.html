<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON Tree Viewer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <textarea id="json-input" placeholder="Paste JSON here"></textarea>
    <input type="file" id="json-file-input" accept=".json">
    <div id="tree-display"></div>
    <div id="controls">
        <select id="tree-style-select"></select>
        <input type="search" id="search-input" placeholder="Search...">
        <button id="filter-button">Filter</button>
        <button id="expand-all-button">Expand All</button>
        <button id="collapse-all-button">Collapse All</button>
        <button id="save-button">Save</button>
        <button id="convert-button">Convert</button>
    </div>
    <script src="script.js" defer></script>

    <div id="test-runner">
        <h2>Unit Test Results</h2>
        <button id="run-tests-button">Run Tests</button>
        <pre id="test-results"></pre>
    </div>
</body>
</html>
